<!doctype html>
<!-- PDS Starter · LinkedIn Carousel (PDF-Dokument, 3 Seiten 4:5) · pds:pages 3 · Regeln: core/templates/social-media.md -->
<html lang="de"><head><meta charset="utf-8"><title>Radhof (Demo) · LinkedIn Carousel (Starter)</title><link rel="stylesheet" href="../brand.css">
<style>
@page{size:1080px 1350px;margin:0}*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-family-body);color:var(--color-text-primary)}
.pds-demo-banner{position:absolute;top:0;left:0;right:0;z-index:9;background:var(--color-bg-inverse);color:var(--color-text-inverse);font:700 22px var(--font-family-body);letter-spacing:.06em;text-align:center;padding:12px}
.pds-open{display:inline-block;background:var(--color-feedback-warning-bg);color:var(--color-feedback-warning-text);border:2px dashed var(--color-feedback-warning-border);border-radius:6px;padding:2px 10px;font-family:var(--font-family-body)}
.pds-demo-banner{position:absolute}
.slide{position:relative;width:1080px;height:1350px;padding:110px 96px;display:flex;flex-direction:column;justify-content:space-between;break-after:page;overflow:hidden;background:var(--color-bg-canvas)}
.slide:last-child{break-after:auto}.slide.brand{background:var(--color-brand-primary);color:var(--color-text-inverse)}
.n{font:600 30px var(--font-family-body);opacity:.8}
h1{font-family:var(--font-family-display);font-size:96px;line-height:1.05;margin:0;font-weight:700}
h2{font-family:var(--font-family-display);font-size:72px;line-height:1.1;margin:0 0 28px}
p{font-size:40px;line-height:1.4;margin:0;max-width:24ch}
.logo{height:60px;width:auto}
</style></head><body>
<div class="slide brand"><div class="pds-demo-banner">DEMO · fiktive Beispielmarke · keine reale, freigegebene Marke</div><span class="n">1 / 3</span><h1>3 Zeichen, dass dein Dienstrad Service braucht</h1><img class="logo" src="../assets/radhof-demo-negative.svg" alt="Radhof Demo"></div>
<div class="slide"><span class="n">2 / 3</span><div><h2>1. Bremsen quietschen</h2><p>Meist reichen neue Beläge. Dauer: 20 Minuten.</p></div><img class="logo" src="../assets/radhof-demo-primary.svg" alt="Radhof Demo"></div>
<div class="slide brand"><span class="n">3 / 3</span><div><h2>Wir kommen vorbei</h2><p>Service vor Ort für Firmen im Viertel.</p></div><img class="logo" src="../assets/radhof-demo-negative.svg" alt="Radhof Demo"></div>
</body></html>

<!doctype html>
<!-- PDS Starter · Pinterest Pin 2:3 · pds:size 1000x1500 · Regeln: core/templates/social-media.md · Maße vor Produktion verifizieren -->
<html lang="de"><head><meta charset="utf-8"><title>Radhof (Demo) · Pinterest Pin (Starter)</title><link rel="stylesheet" href="../brand.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1000px;height:1500px;overflow:hidden}
body{position:relative;font-family:var(--font-family-body);background:var(--color-bg-canvas);color:var(--color-text-primary)}
.pds-demo-banner{position:absolute;top:0;left:0;right:0;z-index:9;background:var(--color-bg-inverse);color:var(--color-text-inverse);font:700 22px var(--font-family-body);letter-spacing:.06em;text-align:center;padding:12px}
.pds-open{display:inline-block;background:var(--color-feedback-warning-bg);color:var(--color-feedback-warning-text);border:2px dashed var(--color-feedback-warning-border);border-radius:6px;padding:2px 10px;font-family:var(--font-family-body)}
.img{height:860px;background:var(--color-bg-surface-sunken);display:flex;align-items:flex-end;padding:48px;font-size:30px;color:var(--color-text-secondary)}
.txt{padding:56px 64px}
.eyebrow{font:600 30px var(--font-family-body);color:var(--color-brand-primary);margin:0 0 18px}
h1{font-family:var(--font-family-display);font-size:78px;line-height:1.05;margin:0 0 22px;font-weight:700}
p{font-size:34px;line-height:1.35;margin:0}
.foot{position:absolute;left:64px;right:64px;bottom:56px;display:flex;justify-content:space-between;align-items:center;font-size:28px;color:var(--color-text-secondary)}
.logo{height:56px;width:auto}
</style></head><body>
<div class="pds-demo-banner">DEMO · fiktive Beispielmarke · keine reale, freigegebene Marke</div>
<div class="img">Bild: Hand ölt Fahrradkette (Platzhalter, Demo)</div>
<div class="txt"><p class="eyebrow">Anleitung</p><h1>Kette richtig ölen in 3 Schritten</h1><p>Sauber, dünn, abwischen. Mehr braucht es nicht.</p></div>
<div class="foot"><img class="logo" src="../assets/radhof-demo-primary.svg" alt="Radhof Demo"><span><span class="pds-open">[OFFEN: channels.pinterest_pin.sample.url]</span></span></div>
</body></html>
